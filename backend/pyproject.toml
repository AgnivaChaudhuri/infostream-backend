[project]
name = "infostream-backend"
version = "0.1.0"
description = "Infostream daemon backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dateutil>=2.9.0",
  "apscheduler>=3.10.4",
  "jsonschema>=4.23.0",
  "structlog>=24.2.0",
  "httpx>=0.27.0",
  "trafilatura>=1.12.0",
  "feedparser>=6.0.11",
  "tenacity>=9.0.0",
  "keyring>=25.3.0",
  "readability-lxml>=0.8.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "pyinstaller>=6.10.0",
]

[project.scripts]
infostreamd = "infostream.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infostream"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
